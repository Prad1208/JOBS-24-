services:
  - type: web
    name: jobs24-backend
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/jobs/stats
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
