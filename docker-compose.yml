services:
  mysql:
    image: mysql:8.0
    container_name: jobs24-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Jyoti100@
      MYSQL_DATABASE: jobs24
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pJyoti100@"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: DockerFile
    container_name: jobs24-backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/jobs24?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Jyoti100@
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: DockerFile
    container_name: jobs24-frontend
    ports:
      - "5173:5173"
    volumes:
      - "./frontend:/app"
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mysql-data: